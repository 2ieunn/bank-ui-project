<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>송금 완료</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="transfer-page">
      <div class="transfer-container">
        <div class="transfer-header">
          <h1>송금 완료</h1>
          <p>송금이 정상적으로 완료되었습니다.</p>
        </div>

        <div class="transfer-card">
          <div class="complete-message-box">
            <div class="complete-icon">✓</div>

            <h2>송금이 완료되었습니다</h2>
            <p>요청하신 금액이 받는 사람 계좌로 정상 송금되었습니다.</p>
          </div>

          <div class="complete-info-list">
            <div class="complete-info-row">
              <span>송금 금액</span>
              <strong class="complete-amount" id="completeAmount">-</strong>
            </div>

            <div class="complete-info-row">
              <span>받는 사람</span>
              <strong id="completeReceiver">-</strong>
            </div>

            <div class="complete-info-row">
              <span>받는 계좌</span>
              <strong id="completeDepositAccount">-</strong>
            </div>

            <div class="complete-info-row">
              <span>거래 일시</span>
              <strong id="completeDateTime">-</strong>
            </div>

            <div class="complete-info-row">
              <span>거래번호</span>
              <strong id="completeTransferNumber">-</strong>
            </div>

            <div class="complete-info-row">
              <span>잔액</span>
              <strong id="completeAfterBalance">-</strong>
            </div>
          </div>

          <div class="complete-button-group">
            <button
              type="button"
              class="complete-sub-btn"
              onclick="location.href = './history.html'"
            >
              거래내역 보기
            </button>

            <button
              type="button"
              class="complete-sub-btn"
              onclick="location.href = './transfer.html'"
            >
            잔액 조회
            </button>

            <button
              type="button"
              class="complete-sub-btn"
              onclick="location.href = './transfer.html'"
            >
              추가 송금
            </button>

            <button
              type="button"
              class="transfer-submit-btn"
              onclick="location.href = './account.html'"
            >
              메인으로
            </button>
          </div>
        </div>
      </div>
    </div>

    <script>
      const depositAccount = localStorage.getItem("transferDepositAccount");
      const receiver = localStorage.getItem("transferReceiver");
      const amount = Number(localStorage.getItem("transferAmount"));
      const afterBalance = Number(localStorage.getItem("transferAfterBalance"));
      const dateTime = localStorage.getItem("transferDateTime");
      const transferNumber = localStorage.getItem("transferNumber");

      function formatMoney(value) {
        return value.toLocaleString("ko-KR") + "원";
      }

      if (!depositAccount || !receiver || !amount) {
        alert("송금 정보가 없습니다. 송금 화면으로 이동합니다.");
        location.href = "./transfer.html";
      } else {
        document.getElementById("completeAmount").textContent =
          formatMoney(amount);
        document.getElementById("completeReceiver").textContent = receiver;
        document.getElementById("completeDepositAccount").textContent =
          depositAccount;
        document.getElementById("completeDateTime").textContent = dateTime;
        document.getElementById("completeTransferNumber").textContent =
          transferNumber;
        document.getElementById("completeAfterBalance").textContent =
          formatMoney(afterBalance);
      }
    </script>
  </body>
</html>
