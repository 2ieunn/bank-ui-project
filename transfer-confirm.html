<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>송금 확인</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="transfer-page">
      <div class="transfer-container">
        <div class="transfer-header">
          <h1>송금 확인</h1>
          <p>입력한 송금 정보를 확인한 뒤 최종 송금을 진행해주세요.</p>
        </div>

        <div class="transfer-card">
          <div class="confirm-title-box">
            <span>확인 필요</span>
            <strong>아래 정보가 맞는지 확인해주세요.</strong>
          </div>

          <div class="confirm-info-list">
            <div class="confirm-info-row">
              <span>받는 계좌</span>
              <strong id="confirmDepositAccount">-</strong>
            </div>

            <div class="confirm-info-row">
              <span>받는 사람</span>
              <strong id="confirmReceiver">-</strong>
            </div>

            <div class="confirm-info-row">
              <span>송금 금액</span>
              <strong class="confirm-amount" id="confirmAmount">-</strong>
            </div>

            <div class="confirm-info-row">
              <span>수수료</span>
              <strong id="confirmFee">0원</strong>
            </div>

            <div class="confirm-info-row">
              <span>출금 계좌</span>
              <strong id="confirmWithdrawAccount">-</strong>
            </div>
          </div>

          <p class="transfer-info-text">
            확인 후 송금 버튼을 누르면 송금 요청이 완료됩니다.
          </p>

          <div class="confirm-button-group">
            <button
              type="button"
              class="confirm-edit-btn"
              onclick="location.href = './transfer.html'"
            >
              수정
            </button>

            <button
              type="button"
              class="transfer-submit-btn"
              onclick="location.href = './transfer-complete.html'"
            >
              확인 후 송금
            </button>
          </div>
        </div>
      </div>
    </div>

    <script>
      const withdrawAccount = localStorage.getItem("transferWithdrawAccount");
      const depositAccount = localStorage.getItem("transferDepositAccount");
      const receiver = localStorage.getItem("transferReceiver");
      const amount = Number(localStorage.getItem("transferAmount"));
      const fee = Number(localStorage.getItem("transferFee"));

      function formatMoney(value) {
        return value.toLocaleString("ko-KR") + "원";
      }

      if (!depositAccount || !receiver || !amount) {
        alert("송금 정보가 없습니다. 송금 화면으로 이동합니다.");
        location.href = "./transfer.html";
      } else {
        document.getElementById("confirmDepositAccount").textContent =
          depositAccount;
        document.getElementById("confirmReceiver").textContent = receiver;
        document.getElementById("confirmAmount").textContent =
          formatMoney(amount);
        document.getElementById("confirmFee").textContent = formatMoney(fee);
        document.getElementById("confirmWithdrawAccount").textContent =
          withdrawAccount;
      }
    </script>
  </body>
</html>
