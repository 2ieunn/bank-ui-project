<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>송금 요청</title>

    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="container transfer-container">
      <section class="transfer-card">
        <header class="page-header">
          <h1>송금 요청</h1>
          <p>송금할 금액을 입력한 뒤 송금 요청 버튼을 눌러주세요.</p>
        </header>

        <div class="available-info">
          <span>출금 가능 금액</span>
          <strong>10,000원</strong>
        </div>

        <div class="input-group">
          <label for="amount">송금 금액</label>
          <input
            type="number"
            id="amount"
            placeholder="송금할 금액을 입력하세요"
          />
        </div>

        <p class="message">출금 가능 금액 이하로 입력해주세요.</p>

        <button class="primary-button">송금 요청</button>
      </section>
    </div>
  </body>
</html>
