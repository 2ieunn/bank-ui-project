<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>잔액 조회</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="balance-page">
      <div class="balance-container">
        <!-- 잔액 조회 화면 상단 영역 -->
        <div class="balance-header">
          <h1>잔액 조회</h1>
          <p>내 계좌의 현재 잔액과 출금 가능 금액을 확인할 수 있습니다.</p>
        </div>

        <div class="balance-card">
          <!-- 조회 중인 계좌번호 표시 영역 -->
          <div class="balance-section">
            <p>계좌 번호</p>
            <strong>110-123-456789</strong>
          </div>

          <div class="balance-line"></div>

          <!-- 현재 잔액 표시 영역 -->
          <div class="balance-section current-balance">
            <p>현재 잔액</p>
            <strong id="balanceCurrentText">10,000원</strong>
          </div>

          <div class="balance-line"></div>

          <!-- 출금 가능 금액 표시 영역 -->
          <div class="balance-section">
            <p>출금 가능 금액</p>
            <strong id="balanceAvailableText">10,000원</strong>
          </div>

          <div class="balance-line"></div>

          <!-- 최근 송금 내역 요약 표시 영역 -->
          <div class="balance-section">
            <p>최근 거래 상태</p>
            <strong id="recentTransferText">최근 송금 내역 없음</strong>
          </div>

          <!-- 하단 이동 버튼 영역 -->
          <div class="complete-button-group">
            <button
              type="button"
              class="complete-sub-btn"
              onclick="location.href = './history.html'"
            >
              거래내역 보기
            </button>

            <button
              type="button"
              class="complete-sub-btn"
              onclick="location.href = './transfer.html'"
            >
              추가 송금
            </button>

            <button
              type="button"
              class="transfer-submit-btn"
              onclick="location.href = './account.html'"
            >
              메인으로
            </button>
          </div>
        </div>
      </div>
    </div>

    <script>
      // ================================
      // 1. 공통 함수
      // ================================

      // 숫자를 한국 원화 형식으로 변환
      // 예: 10000 → 10,000원
      function formatMoney(value) {
        return Number(value).toLocaleString("ko-KR") + "원";
      }

      // ================================
      // 2. 잔액 데이터 가져오기
      // ================================

      // 현재 잔액
      // 현재는 백엔드 API가 없기 때문에 localStorage의 currentBalance 값을 사용
      // 송금 성공 시 transfer-confirm.html에서 currentBalance가 송금 후 잔액으로 업데이트됨
      // 값이 없으면 기본값 10,000원으로 표시
      const currentBalance = Number(
        localStorage.getItem("currentBalance") || 10000,
      );

      // ================================
      // 3. 거래내역 데이터 가져오기
      // ================================

      // 송금 거래내역
      // 현재는 송금 성공 시 localStorage의 transferHistories 배열에 저장됨
      // 최신 거래가 배열의 맨 앞에 오도록 unshift로 저장되어 있음
      // 실제 백엔드 연동 시에는 거래내역 조회 API 응답값으로 대체 가능
      const transferHistories = JSON.parse(
        localStorage.getItem("transferHistories") || "[]",
      );

      // ================================
      // 4. 화면에 잔액 표시
      // ================================

      // 현재 잔액 표시
      document.getElementById("balanceCurrentText").textContent =
        formatMoney(currentBalance);

      // 출금 가능 금액 표시
      // 현재는 별도 제한금액이 없기 때문에 현재 잔액과 동일하게 표시
      // 실제 백엔드 연동 시에는 availableBalance 값을 따로 받아 표시할 수 있음
      document.getElementById("balanceAvailableText").textContent =
        formatMoney(currentBalance);

      // ================================
      // 5. 최근 거래 상태 표시
      // ================================

      // 저장된 거래내역이 있으면 가장 최근 거래 1건을 화면에 표시
      if (transferHistories.length > 0) {
        // 최신 거래는 배열의 첫 번째 항목
        const recentTransfer = transferHistories[0];

        // 최근 거래 상태 문구 생성
        // 예: 2026-05-26 김민수님에게 5,000원 송금
        document.getElementById("recentTransferText").textContent =
          `${recentTransfer.date} ${recentTransfer.partner}님에게 ` +
          `${formatMoney(recentTransfer.amount)} 송금`;
      }

      // 저장된 거래내역이 없으면 기본 문구 표시
      else {
        document.getElementById("recentTransferText").textContent =
          "최근 송금 내역 없음";
      }
    </script>
  </body>
</html>
