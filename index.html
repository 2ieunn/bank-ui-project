<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="page">
      <!-- 로그인 카드 전체 영역 -->
      <section class="login-card">
        <div class="login-header">
          <h1>안전하게 로그인하세요.</h1>
          <p>등록하신 아이디와 비밀번호를 입력해 주세요.</p>
        </div>

        <!--
          로그인 입력 폼

          현재 구조:
          - 실제 로그인 API 검증은 없음
          - 로그인 버튼 클릭 시 account.html로 이동함

          추후 백엔드 연동 시:
          - action="./account.html" 방식 대신 JavaScript fetch로 로그인 API 요청
          - API 성공 시 account.html로 이동
          - API 실패 시 에러 메시지 표시
        -->
        <form class="login-form" action="./account.html" method="get">
          <!-- 아이디 입력 영역 -->
          <div class="form-group">
            <label for="userId">아이디</label>
            <input
              type="text"
              id="userId"
              name="userId"
              placeholder="아이디를 입력해 주세요"
            />
          </div>

          <!-- 비밀번호 입력 영역 -->
          <div class="form-group">
            <label for="password">비밀번호</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="비밀번호를 입력해 주세요"
            />
          </div>

          <!-- 아이디 저장, 비밀번호 찾기 옵션 영역 -->
          <div class="option-row">
            <label class="save-id">
              <input type="checkbox" id="saveIdCheck" checked />
              <span>아이디 저장</span>
            </label>

            <a href="#" class="find-password">비밀번호를 잊으셨나요?</a>
          </div>

          <!--
            로그인 버튼

            현재:
            - submit 버튼이므로 클릭하면 form action에 지정된 account.html로 이동

            추후:
            - 로그인 API 성공 여부에 따라 이동 여부를 결정하는 방식으로 변경 가능
          -->
          <button type="submit" class="login-button">로그인</button>

          <!-- 보안 안내 문구 영역 -->
          <!-- 현재는 빈 span만 있으므로 필요 없으면 제거 가능 -->
          <div class="security-text">
            <span></span>
            <span></span>
          </div>

          <div class="divider"></div>

          <!-- 하단 링크 영역 -->
          <div class="bottom-links">
            <a href="#">아이디 찾기</a>
            <span></span>
            <p>아직 회원이 아니신가요?</p>
            <a href="#" class="join-link">회원가입</a>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
